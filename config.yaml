models:
  anomaly_detector:
    path: "models/anomaly_detector/model.xml"
    device: "CPU"
  classifier:
    model_path: "models/classifier/model.onnx"
    meta_path: "models/classifier/meta.json"

pipeline:
  thresholds:
    low: 0.3
    high: 0.7
  lake_dir: "data/lake"

data_layer:
  enabled: false
  database_url: "postgresql+psycopg2://hazelnut:hazelnut@localhost:5432/weird_hazelnut"
  object_storage:
    endpoint: "localhost:9000"
    access_key: "minioadmin"
    secret_key: "minioadmin"
    bucket: "weird-hazelnut"
    secure: false
    region: "us-east-1"
    public_endpoint: "localhost:9000"
    public_secure: false

server:
  host: "0.0.0.0"
  port: 8000

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  artifact_root: "mlruns"
  experiment_name: "WeirdHazelnut_Integrated_Pipeline"
  run_name: "Production_Inference_Session"
  log_images: true

training:
  anomaly_detector:
    enabled: true
    run_name: "Retraining_AD_MinIO"
    model_name: "patchcore"
    backbone: "resnet18"
    coreset_sampling_ratio: 0.005
    num_neighbors: 9
    image_size: [256, 256]
    train_batch_size: 32
    test_batch_size: 32
    max_epochs: 3
    accelerator: "cpu"
    devices: 0
    export_type: "OPENVINO"
    export_root: "models/anomaly_detector_retrained"
  classifier:
    enabled: true
    run_name: "Retraining_Classifier_MinIO"
    output_dir: "models/classifier_retrained"
    onnx_name: "model.onnx"
    meta_name: "meta.json"
    img_size: 224
    epochs: 50
    batch_size: 32
    lr: 0.001
    weight_decay: 0.0001
    label_smooth: 0.1
    early_stop: 10
    augment_level: "medium"
    include_good: false
    pretrained: true
    dataset_dir: "data/classifier_dataset"
    split_ratio: 0.8
    train_priority_threshold: 10

label_studio:
  url: "http://localhost:8080"
  api_key: "PASTE_YOUR_API_KEY_HERE"
  project_id: 1

registry:
  enabled: false # Set to true to use models from MLflow registry
  anomaly_detector: "models:/Hazelnut_Anomaly_Detector/Production"
  classifier: "models:/Hazelnut_Classifier/Production"

data_sync:
  promote_annotations_to_dataset: true
  human_feedback_dataset_name: human_feedback_dataset
  human_feedback_split: train

  human_feedback_split_strategy:
    enabled: true
    train_ratio: 0.8
    val_ratio: 0.2
    method: hash_by_label_and_image_id
