services:
  app:
    build: .
    container_name: weird-hazelnut-app
    ports:
      - "8000:8000"
    volumes:
      - ./config.docker.yaml:/app/config.docker.yaml
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./labeling:/app/labeling
      - ./data:/app/data
      - ./models:/app/models
      - ./mlflow_data:/app/mlflow_data
      - ./mlruns:/app/mlruns
      - ./openvino_cache:/app/openvino_cache
    environment:
      - CONFIG_PATH=config.docker.yaml
      - PYTHONPATH=/app/src
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started
      label-studio:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - hazelnut-net
    restart: always

  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: label-studio-app
    ports:
      - "8080:8080"
    volumes:
      - label_studio_data:/label-studio/data
      - ./data:/label-studio/files
    environment:
      - LABEL_STUDIO_USERNAME=admin@example.com
      - LABEL_STUDIO_PASSWORD=admin123456
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/files
    networks:
      - hazelnut-net
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    build: .
    container_name: weird-hazelnut-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_data:/app/mlflow_data
      - ./mlruns:/app/mlruns
    command: >
      mlflow ui
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////app/mlflow_data/mlflow.db
      --default-artifact-root /app/mlruns
    networks:
      - hazelnut-net
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: weird-hazelnut-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=weird_hazelnut
      - POSTGRES_USER=hazelnut
      - POSTGRES_PASSWORD=hazelnut
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hazelnut-net
    restart: always

  minio:
    image: minio/minio:latest
    container_name: weird-hazelnut-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    networks:
      - hazelnut-net
    restart: always

  airflow-init:
    image: apache/airflow:2.10.5-python3.10
    container_name: weird-hazelnut-airflow-init
    user: "0:0"
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com || true
      "
    environment:
      - AIRFLOW_HOME=/opt/airflow
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow:/opt/airflow
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - hazelnut-net

  airflow-webserver:
    image: apache/airflow:2.10.5-python3.10
    container_name: weird-hazelnut-airflow-webserver
    user: "0:0"
    command: airflow webserver --port 8088
    ports:
      - "8088:8088"
    environment:
      - AIRFLOW_HOME=/opt/airflow
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow:/opt/airflow
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - hazelnut-net
    restart: unless-stopped

  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.10
    container_name: weird-hazelnut-airflow-scheduler
    user: "0:0"
    command: airflow scheduler
    environment:
      - AIRFLOW_HOME=/opt/airflow
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow:/opt/airflow
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_started
    networks:
      - hazelnut-net
    restart: unless-stopped

networks:
  hazelnut-net:
    driver: bridge

volumes:
  label_studio_data:
  postgres_data:
  minio_data:
  