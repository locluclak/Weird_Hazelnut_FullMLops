services:
  app:
    build: .
    container_name: weird-hazelnut-app
    ports:
      - "8000:8000"
    volumes:
      - ./config.docker.yaml:/app/config.docker.yaml
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./labeling:/app/labeling
      - ./data:/app/data
      - ./models:/app/models
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
      - ./openvino_cache:/app/openvino_cache
    environment:
      - CONFIG_PATH=config.docker.yaml
    depends_on:
      - postgres
      - minio
      - label-studio
    networks:
      - hazelnut-net
    restart: always

  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: label-studio-app
    ports:
      - "8080:8080"
    volumes:
      - label_studio_data:/label-studio/data
    environment:
      - LABEL_STUDIO_USERNAME=admin@example.com
      - LABEL_STUDIO_PASSWORD=admin123456
    networks:
      - hazelnut-net
    restart: always

  mlflow:
    build: .
    container_name: weird-hazelnut-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
    command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////app/mlflow.db --default-artifact-root /app/mlruns
    networks:
      - hazelnut-net
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: weird-hazelnut-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=weird_hazelnut
      - POSTGRES_USER=hazelnut
      - POSTGRES_PASSWORD=hazelnut
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hazelnut-net
    restart: always

  minio:
    image: minio/minio:latest
    container_name: weird-hazelnut-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    networks:
      - hazelnut-net
    restart: always

networks:
  hazelnut-net:
    driver: bridge

volumes:
  label_studio_data:
  postgres_data:
  minio_data:
