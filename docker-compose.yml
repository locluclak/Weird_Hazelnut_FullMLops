services:
  app:
    build: .
    container_name: weird-hazelnut-app
    ports:
      - "8000:8000"
    volumes:
      - ./config.docker.yaml:/app/config.docker.yaml
      - ./src:/app/src
      - ./labeling:/app/labeling
      - ./data:/app/data
      - ./models:/app/models
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
      - ./openvino_cache:/app/openvino_cache
    environment:
      - CONFIG_PATH=config.docker.yaml
    depends_on:
      - label-studio
    networks:
      - hazelnut-net
    restart: always

  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: label-studio-app
    ports:
      - "8080:8080"
    volumes:
      - label_studio_data:/label-studio/data
      - ./data/lake:/label-studio/files/lake
    environment:
      - LABEL_STUDIO_USERNAME=admin@example.com
      - LABEL_STUDIO_PASSWORD=admin123456
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/files
    networks:
      - hazelnut-net
    restart: always

  mlflow:
    build: .
    container_name: weird-hazelnut-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
    command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////app/mlflow.db --default-artifact-root /app/mlruns
    networks:
      - hazelnut-net
    restart: always

networks:
  hazelnut-net:
    driver: bridge

volumes:
  label_studio_data:
